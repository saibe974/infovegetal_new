<VirtualHost *:80> 
    DocumentRoot "D:/clients/infovegetal.new/public"
    ServerName infovegetal.new.test
    ServerAlias *.infovegetal.new.test
    <Directory "D:/clients/infovegetal.new/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

