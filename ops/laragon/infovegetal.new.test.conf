# PHP for this project only; other Laragon vhosts keep their PHP handler.
<IfModule !fcgid_module>
    LoadModule fcgid_module "C:/laragon/etc/apache2/modules/mod_fcgid.so"
</IfModule>
<VirtualHost *:80> 
    DocumentRoot "D:/clients/infovegetal.new/public"
    ServerName infovegetal.new.test
    ServerAlias *.infovegetal.new.test
    <Directory "D:/clients/infovegetal.new/public">
        AllowOverride All
        Require all granted
    </Directory>
    FcgidInitialEnv PHPRC "C:/laragon/bin/php/php-8.3.26-Win32-vs16-x64"
    FcgidInitialEnv PHP_FCGI_MAX_REQUESTS 1000
    FcgidMaxRequestsPerProcess 1000
    FcgidMaxRequestLen 110100480
    FcgidWrapper "C:/laragon/bin/php/php-8.3.26-Win32-vs16-x64/php-cgi.exe" .php
    <FilesMatch "\.php$">
        SetHandler fcgid-script
    </FilesMatch>
    # Keep private artifacts and executable uploads outside HTTP access.
    <Directory "D:/clients/infovegetal.new/public/storage">
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|py|shtml|asp|aspx|jsp)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <DirectoryMatch "(?i)^D:/clients/infovegetal\.new/public/storage/(imports|commandes|user-meta/[0-9]+/commandes)(/|$)">
        Require all denied
    </DirectoryMatch>
    <LocationMatch "(?i)(^|/)(\.env[^/]*|\.git(/.*)?|composer\.(json|lock)|package(-lock)?\.json)$">
        Require all denied
    </LocationMatch>
</VirtualHost>

# If you want to use SSL, enable it by going to Menu > Apache > SSL > Enabled



